<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Market Data Miner{% endblock %}</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<header class="topbar">
  <div>
    <a class="brand" href="/">Market Data Miner</a>
    <span class="subtitle">collection-only v3.0.1</span>
  </div>
  {% if request.session.get('authenticated') %}
  <nav>
    <a href="/">Runs</a>
    <a href="/instruments">Instruments</a>
    <form action="/logout" method="post" class="inline"><button class="link-button">Sign out</button></form>
  </nav>
  {% endif %}
</header>
<main class="container">
  {% block content %}{% endblock %}
</main>
</body>
</html>

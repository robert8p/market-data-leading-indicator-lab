{% extends "base.html" %}{% block title %}Sign in{% endblock %}{% block content %}
<section class="login-card"><h1>Market Data Miner</h1><p>Sign in to manage collection runs.</p>

<form method="post" action="/login" class="stack"><label>Username <input name="username" autocomplete="username"></label><label>Password <input type="password" name="password" autocomplete="current-password"></label><button class="primary">Sign in</button></form>
</section>{% endblock %}

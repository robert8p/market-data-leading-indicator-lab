name: B-001 replication CI

on:
  push:
    branches:
      - main
      - b001-locked-replication
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app tests
      - name: Import worker and web entry points
        run: python -c "import app.worker; import app.b001_web"
      - name: Run pytest
        shell: bash
        run: |
          set +e
          python -m pytest -q > pytest-output.txt 2>&1
          code=$?
          cat pytest-output.txt
          exit $code
      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostics
          path: pytest-output.txt

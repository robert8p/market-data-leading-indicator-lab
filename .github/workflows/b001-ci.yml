name: B-001 replication CI

on:
  push:
    branches:
      - main
      - b001-locked-replication
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app tests
      - name: Verify guard-preserving diagnostic image bytes
        run: |
          python - <<'PY'
          import hashlib, json, runpy
          from pathlib import Path
          builder = runpy.run_path('scripts/eq20_runner_diagnostic_patch.py')
          original = Path('app/eq20_runner_orchestrator.py').read_bytes()
          image = builder['patched_bytes'](original)
          assert 'RUN python scripts/eq20_runner_diagnostic_patch.py' in Path('Dockerfile').read_text()
          proof = dict(version=1, predecessor_sha256=hashlib.sha256(original).hexdigest(),
                       runner_image_sha256=hashlib.sha256(image).hexdigest(),
                       predecessor_bytes=len(original), image_bytes=len(image),
                       repository_input_unchanged=True, production_deployed=False)
          Path('runner-diagnostic-public-provenance.json').write_text(json.dumps(proof, indent=2))
          print(json.dumps(proof, sort_keys=True))
          PY
      - name: Import worker and web entry points
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: test-key
          APP_PASSWORD: test-password
          SESSION_SECRET: test-session-secret
        run: python -c "import app.worker; import app.b001_web"
      - name: Run pytest
        shell: bash
        run: |
          set +e
          python -m pytest -q > pytest-output.txt 2>&1
          code=$?
          cat pytest-output.txt
          exit $code
      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostics
          path: |
            pytest-output.txt
            runner-diagnostic-public-provenance.json

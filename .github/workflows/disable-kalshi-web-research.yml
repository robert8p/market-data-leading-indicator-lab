name: Disable heavy research in Kalshi web process

on:
  push:
    branches:
      - agent/kalshi-disable-web-research-20260901

permissions:
  contents: write

jobs:
  patch-test-and-promote:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production application branch
        uses: actions/checkout@v4
        with:
          ref: agent/kalshi-perps-probability-app-v1
          fetch-depth: 0

      - name: Decode and verify current source bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/kalshi-source
          cat kalshi_bundle/part-*.b64 | base64 -d > /tmp/kalshi-current.tar.gz
          EXPECTED=$(cut -d' ' -f1 kalshi_bundle/SHA256SUMS)
          echo "$EXPECTED  /tmp/kalshi-current.tar.gz" | sha256sum -c -
          tar -xzf /tmp/kalshi-current.tar.gz -C /tmp/kalshi-source

      - name: Add an explicit research-process switch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          config = Path('/tmp/kalshi-source/kalshi_perps_app/config.py')
          text = config.read_text()
          marker = '    scheduler_enabled: bool = True\n'
          replacement = marker + '    research_enabled: bool = True\n'
          if 'research_enabled: bool' not in text:
              if marker not in text:
                  raise SystemExit('scheduler_enabled marker not found')
              text = text.replace(marker, replacement, 1)
          config.write_text(text)

          scheduler = Path('/tmp/kalshi-source/kalshi_perps_app/scheduler.py')
          text = scheduler.read_text()
          old = '''    async def _research(self) -> object:
        await self.pipeline._ensure_markets_cache()  # internal orchestration, not a public endpoint
        return await self.pipeline.research.ensure_research_models(list(self.pipeline.markets.values()))
'''
          new = '''    async def _research(self) -> object:
        # Model training loads a large historical panel and performs CPU-heavy fitting.
        # It must be opt-in on a web process so public HTTP availability, live ingestion
        # and prediction scoring cannot be starved by research work.
        if not self.settings.research_enabled:
            LOGGER.info("Automatic research is disabled for this runtime")
            return {"status": "disabled"}
        await self.pipeline._ensure_markets_cache()  # internal orchestration, not a public endpoint
        return await self.pipeline.research.ensure_research_models(list(self.pipeline.markets.values()))
'''
          if old not in text:
              if 'Automatic research is disabled for this runtime' not in text:
                  raise SystemExit('research method did not match expected source')
          else:
              text = text.replace(old, new, 1)
          scheduler.write_text(text)
          PY

      - name: Add scheduler regression test
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/kalshi-source/tests/test_scheduler.py <<'PY'
          from types import SimpleNamespace

          import pytest

          from kalshi_perps_app.scheduler import AppScheduler


          class ExplodingPipeline:
              async def _ensure_markets_cache(self):
                  raise AssertionError('research pipeline should not be touched')


          @pytest.mark.asyncio
          async def test_research_is_inert_when_disabled():
              scheduler = AppScheduler(
                  settings=SimpleNamespace(research_enabled=False),
                  pipeline=ExplodingPipeline(),
              )
              assert await scheduler._research() == {"status": "disabled"}
          PY

      - name: Test repaired source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-kalshi.txt pytest pytest-asyncio
          cd /tmp/kalshi-source
          python -m compileall -q kalshi_perps_app tests
          PYTHONPATH=. pytest -q

      - name: Repack and verify source bundle
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/kalshi-source
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          rm -rf .pytest_cache
          tar --sort=name --mtime='UTC 2026-09-01' --owner=0 --group=0 --numeric-owner \
            -czf /tmp/kalshi-fixed.tar.gz kalshi_perps_app tests docs
          FIXED_SHA=$(sha256sum /tmp/kalshi-fixed.tar.gz | awk '{print $1}')

          cd "$GITHUB_WORKSPACE"
          rm -f kalshi_bundle/part-*.b64
          base64 -w0 /tmp/kalshi-fixed.tar.gz | split -b 7000 -d -a 2 - kalshi_bundle/part-
          for file in kalshi_bundle/part-[0-9][0-9]; do mv "$file" "$file.b64"; done
          printf '%s  kalshi-source.tar.gz\n' "$FIXED_SHA" > kalshi_bundle/SHA256SUMS

          cat kalshi_bundle/part-*.b64 | base64 -d > /tmp/kalshi-check.tar.gz
          echo "$FIXED_SHA  /tmp/kalshi-check.tar.gz" | sha256sum -c -

      - name: Commit verified availability repair to production branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kalshi-app-automation"
          git config user.email "actions@users.noreply.github.com"
          git add kalshi_bundle
          git diff --cached --check
          git commit -m "Keep heavy model research out of Kalshi web runtime"
          git push origin HEAD:agent/kalshi-perps-probability-app-v1

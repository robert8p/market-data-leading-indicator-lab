services:
  - type: web
    name: market-data-lab-web
    runtime: docker
    region: frankfurt
    plan: free
    healthCheckPath: /health
    preDeployCommand: python -m app.migrate
    maxShutdownDelaySeconds: 60
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RAW_BUCKET
        value: market-data-raw
      - key: APP_USERNAME
        value: rob
      - key: APP_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: LOG_LEVEL
        value: INFO

  - type: worker
    name: market-data-lab-worker
    runtime: docker
    region: frankfurt
    plan: starter
    dockerCommand: python -m app.worker_with_xal
    maxShutdownDelaySeconds: 300
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RAW_BUCKET
        value: market-data-raw
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_API_SECRET
        sync: false
      - key: ALPACA_FEED
        value: sip
      - key: ALPACA_OTC_ENABLED
        value: "false"
      - key: ALPACA_REQUESTS_PER_MINUTE
        value: "9000"
      - key: MASSIVE_API_KEY
        sync: false
      - key: MASSIVE_REQUESTS_PER_MINUTE
        value: "60"
      - key: SEC_USER_AGENT
        sync: false
      - key: SEC_DOCUMENT_SCAN_ENABLED
        value: "true"
      - key: SEC_MAX_DOCUMENTS_PER_SYMBOL
        value: "8"
      - key: COINGECKO_DEMO_API_KEY
        sync: false
      - key: TWELVEDATA_API_KEY
        sync: false
      - key: TWELVEDATA_SYMBOL_CAP
        value: "200"
      - key: TWELVEDATA_REQUESTS_PER_MINUTE
        value: "8"
      - key: TWELVEDATA_INDICATORS
        value: SPY,QQQ,IWM,DIA,VIX,DXY,GLD,SLV,USO,TLT,HYG,LQD,UUP,FXE,EWJ,EEM,BTC/USD,ETH/USD,EUR/USD,GBP/USD,USD/JPY,USD/CHF,AUD/USD,XAU/USD,XAG/USD
      - key: BINANCE_PAIR_MODE
        value: all
      - key: CRYPTO_FULL_PAIR_UNIVERSE
        value: "true"
      - key: BINANCE_QUOTE_PRIORITY
        value: USDT,USDC,FDUSD,BTC,ETH
      - key: COINBASE_ALLOWED_QUOTES
        value: USD,USDC,GBP,EUR,BTC,ETH
      - key: EQUITY_ENRICHMENT_ENABLED
        value: "true"
      - key: EQUITY_CONTEXT_SCOPE
        value: all
      - key: CRYPTO_ENRICHMENT_ENABLED
        value: "true"
      - key: CAPTURE_SCAN_ENABLED
        value: "true"
      - key: CAPTURE_WINDOW_BEFORE_MINUTES
        value: "120"
      - key: EQUITY_BASELINE_SAMPLE_ENABLED
        value: "true"
      - key: EQUITY_BASELINE_SAMPLE_RATE
        value: "0.005"
      - key: EQUITY_BASELINE_MAX_WINDOWS_PER_RUN
        value: "1000"
      - key: DB_POOL_SIZE
        value: "4"
      - key: WORKER_POLL_SECONDS
        value: "2"
      - key: STALE_PARTITION_MINUTES
        value: "15"
      - key: COLLECTION_END_LAG_MINUTES
        value: "5"
      - key: MAX_PARTITION_ATTEMPTS
        value: "8"
      - key: LOG_LEVEL
        value: INFO

  - type: worker
    name: market-data-crypto-stream
    runtime: docker
    region: frankfurt
    plan: standard
    dockerCommand: python -m app.crypto_stream_entrypoint
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - app/crypto_stream.py
        - app/crypto_stream_*.py
        - app/crypto_catalogue_bootstrap.py
        - app/dynamic_detection.py
        - app/storage.py
        - app/config.py
        - app/db.py
        - app/http.py
        - app/exceptions.py
        - app/enrichment.py
        - requirements.txt
        - Dockerfile
    maxShutdownDelaySeconds: 300
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RAW_BUCKET
        value: market-data-raw
      - key: CRYPTO_STREAM_ENABLED
        value: "true"
      - key: CRYPTO_STREAM_VENUES
        value: coinbase,binance_spot,binance_futures,kraken,bybit
      - key: CRYPTO_STREAM_CORE_SYMBOLS
        value: BTC,ETH,SOL,XRP,BNB,DOGE,ADA,AVAX,LINK,LTC,BCH,DOT,UNI,AAVE,ATOM,DOGS
      - key: CRYPTO_STREAM_MAX_DYNAMIC_TARGETS
        value: "75"
      - key: CRYPTO_AGGREGATION_SECONDS
        value: "1"
      - key: CRYPTO_ORDER_BOOK_DEPTH
        value: "20"
      - key: CRYPTO_RAW_CAPTURE_ENABLED
        value: "true"
      - key: CRYPTO_RAW_CORE_ENABLED
        value: "false"
      - key: CRYPTO_FULL_PAIR_UNIVERSE
        value: "true"
      - key: CRYPTO_BROAD_OBSERVATION_ENABLED
        value: "true"
      - key: CRYPTO_BROAD_OBSERVATION_SECONDS
        value: "60"
      - key: CRYPTO_BROAD_BUFFER_SECONDS
        value: "15"
      - key: CRYPTO_BROAD_BUFFER_MINUTES
        value: "120"
      - key: CRYPTO_PRESERVE_PRETRIGGER_BUFFER
        value: "true"
      - key: CRYPTO_RAW_SEGMENT_MINUTES
        value: "15"
      - key: BROAD_CRYPTO_TRIGGER_ENABLED
        value: "true"
      - key: BROAD_CRYPTO_TRIGGER_MOVE_PCT
        value: "1.5"
      - key: BROAD_CRYPTO_FAST_WINDOW_MINUTES
        value: "1"
      - key: BROAD_CRYPTO_FAST_MOVE_PCT
        value: "0.75"
      - key: BROAD_CRYPTO_TRIGGER_WINDOW_MINUTES
        value: "5"
      - key: BROAD_CRYPTO_SLOW_WINDOW_MINUTES
        value: "15"
      - key: BROAD_CRYPTO_SLOW_MOVE_PCT
        value: "2.5"
      - key: BROAD_CRYPTO_CONFIRMATION_COUNT
        value: "2"
      - key: BROAD_CRYPTO_CONFIRMED_MOVE_PCT
        value: "0.75"
      - key: BROAD_CRYPTO_DERIVATIVE_MOVE_PCT
        value: "1.0"
      - key: BROAD_CRYPTO_SPOT_CONFIRMATION_PCT
        value: "0.35"
      - key: BROAD_CRYPTO_VOLUME_MOVE_PCT
        value: "0.5"
      - key: BROAD_CRYPTO_VOLUME_ACCELERATION
        value: "3.0"
      - key: BROAD_CRYPTO_CONFIRMATION_SECONDS
        value: "45"
      - key: BROAD_CRYPTO_TRIGGER_COOLDOWN_SECONDS
        value: "300"
      - key: BROAD_CRYPTO_SCANNER_POLL_SECONDS
        value: "5"
      - key: DB_POOL_SIZE
        value: "4"
      - key: LOG_LEVEL
        value: INFO

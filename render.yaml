services:
  - type: worker
    name: eq17-independent-recorder-20261109
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    branch: eq17-recorder-20261109
    numInstances: 1
    autoDeployTrigger: "off"
    dockerfilePath: ./Dockerfile
    dockerContext: .
    disk:
      name: eq17-private-observer-evidence
      mountPath: /var/data/eq17
      sizeGB: 1
    envVars:
      - key: EQ17_OBSERVER_PASSWORD
        fromService:
          type: web
          name: market-data-lab-web
          envVarKey: APP_PASSWORD
      - key: RECORDER_ADMISSION_B64
        sync: false
      - key: RECORDER_PUBLIC_KEY_B64
        sync: false
      - key: RECORDER_KEY_SHA256
        sync: false
